[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdai"
version = "0.1.0"
description = "AI-Based Indian Road Damage Detection, Severity Assessment & Geo-Mapped Maintenance Prioritization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "TiGeR" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src"]
testpaths = [
    "tests/unit",
    "tests/integration",
    "tests/api",
    "tests/security",
    "tests/model",
    "tests/perf",
]
addopts = [
    "--strict-markers",
    "-ra",
    "-m",
    "not slow and not gpu and not perf",
]
markers = [
    "slow: marks tests that load real YOLO11/ONNX weights (run with 'make test-model')",
    "gpu: marks tests that require or benchmark a GPU (run with 'make test-model')",
    "perf: marks performance and latency benchmark tests (run with 'make test-perf')",
]

[tool.coverage.run]
source = ["src/rdai"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rdai"]
