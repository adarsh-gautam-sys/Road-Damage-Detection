name: CI

on:
  push:
    branches: ["main", "master", "m*"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Generate synthetic test fixtures
        run: python scripts/make_fixtures.py

      - name: Run Ruff linter and formatter check
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Run fast pytest suite with coverage
        run: pytest -m "not slow and not gpu and not perf" --cov=src/rdai --cov-fail-under=80
