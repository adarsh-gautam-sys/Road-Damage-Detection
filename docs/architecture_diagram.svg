<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 800; fill: #f8fafc; letter-spacing: 0.5px; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; }
    .layer-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #cbd5e1; text-transform: uppercase; letter-spacing: 1.2px; }
    .card-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #f1f5f9; }
    .card-body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #94a3b8; line-height: 1.4; }
    .card-accent { font-family: 'Consolas', 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #38bdf8; }
    .card-math { font-family: 'Consolas', 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #f59e0b; }
    .badge { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  </style>

  <!-- Canvas Background -->
  <rect width="1280" height="880" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.05">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" />
    </pattern>
    <rect width="1280" height="880" fill="url(#grid)" />
  </g>

  <!-- ================= HEADER ================= -->
  <g transform="translate(60, 45)">
    <rect x="-10" y="-8" width="5" height="42" fill="url(#goldGrad)" rx="2" />
    <text class="title" x="12" y="18">Road Damage AI (rdai) — End-to-End System Architecture</text>
    <text class="subtitle" x="12" y="38">YOLO11s Detection • Class-Aware Geometric Severity • 25m Haversine Clustering • Explainable Maintenance Priority</text>
  </g>

  <!-- ================= 1. CLIENT & INGESTION LAYER ================= -->
  <g transform="translate(60, 115)">
    <!-- Group Container -->
    <rect width="250" height="695" rx="12" fill="#131b2e" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="20" y="20" width="8" height="8" rx="4" fill="#38bdf8" />
    <text class="layer-title" x="36" y="28">1. Client &amp; Field Ingestion</text>

    <!-- Field Device: Mobile Live Camera HUD -->
    <g transform="translate(18, 48)">
      <rect width="214" height="135" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="card-title" x="14" y="24">Mobile Live Patrol HUD</text>
      <text class="card-body" x="14" y="44">WebRTC camera &lt;video&gt; stream</text>
      <text class="card-body" x="14" y="60">Client canvas overlay (4 FPS)</text>
      <text class="card-body" x="14" y="76">Continuous GPS watchPosition</text>
      <text class="card-accent" x="14" y="98">Auto-Patrol: &gt;=10m &amp; &gt;=5s</text>
      <text class="card-body" x="14" y="118">One-tap Shutter / PWA Ready</text>
    </g>

    <!-- Photo Upload with EXIF Extraction -->
    <g transform="translate(18, 198)">
      <rect width="214" height="135" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="card-title" x="14" y="24">Photo Upload &amp; EXIF</text>
      <text class="card-body" x="14" y="44">Single snapshot capture (JPEG/PNG)</text>
      <text class="card-body" x="14" y="60">Client-side resize (&lt;=1280px)</text>
      <text class="card-body" x="14" y="76">EXIF GPS extraction with fallback</text>
      <text class="card-accent" x="14" y="98">Explicit lat/lng query param</text>
      <text class="card-body" x="14" y="118">Draggable pin location picker</text>
    </g>

    <!-- Dashcam Video & GPX Track -->
    <g transform="translate(18, 348)">
      <rect width="214" height="135" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="card-title" x="14" y="24">Dashcam Video &amp; GPX</text>
      <text class="card-body" x="14" y="44">Vehicle dashcam (.mp4 / .mov)</text>
      <text class="card-body" x="14" y="60">Synchronized GPX / CSV track</text>
      <text class="card-body" x="14" y="76">Timestamp-interpolated GPS</text>
      <text class="card-accent" x="14" y="98">Async Background Job Polling</text>
      <text class="card-body" x="14" y="118">Tolerance window: &lt;= 5.0 sec</text>
    </g>

    <!-- Desktop Command Center -->
    <g transform="translate(18, 498)">
      <rect width="214" height="175" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="card-title" x="14" y="24">Desktop Triage Station</text>
      <text class="card-body" x="14" y="44">React 18 + Vite + Leaflet OSM</text>
      <text class="card-body" x="14" y="60">Interactive Map: 25m Segments</text>
      <text class="card-body" x="14" y="76">Ranked Repair Queue with Ledger</text>
      <text class="card-body" x="14" y="92">Work-order lifecycle transitions</text>
      <text class="card-accent" x="14" y="116">new -&gt; verified -&gt; scheduled</text>
      <text class="card-accent" x="14" y="132">scheduled -&gt; fixed</text>
      <text class="card-body" x="14" y="154">GeoJSON &amp; CSV export triggers</text>
    </g>
  </g>

  <!-- ================= 2. FASTAPI GATEWAY & PERSISTENCE ================= -->
  <g transform="translate(340, 115)">
    <rect width="270" height="695" rx="12" fill="#131b2e" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="20" y="20" width="8" height="8" rx="4" fill="#10b981" />
    <text class="layer-title" x="36" y="28">2. FastAPI Gateway &amp; Validation</text>

    <!-- API Router Box -->
    <g transform="translate(18, 48)">
      <rect width="234" height="205" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="card-title" x="14" y="24">REST API Router (/api/v1)</text>
      <text class="card-accent" x="14" y="48">POST /detections/photo</text>
      <text class="card-body" x="14" y="64">  Image multipart + lat, lng, conf</text>
      <text class="card-accent" x="14" y="86">POST /detections/video</text>
      <text class="card-body" x="14" y="102">  Async job queue (ByteTrack dedup)</text>
      <text class="card-accent" x="14" y="124">GET  /segments (ranked queue)</text>
      <text class="card-accent" x="14" y="144">PATCH /segments/{id} (status)</text>
      <text class="card-accent" x="14" y="164">POST /segments/recluster</text>
      <text class="card-accent" x="14" y="184">GET  /metrics &amp; /exports</text>
    </g>

    <!-- Request Validation & Security -->
    <g transform="translate(18, 268)">
      <rect width="234" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="card-title" x="14" y="24">Safety &amp; Validation Guard</text>
      <text class="card-body" x="14" y="44">• Max payload: 15MB photo, 200MB vid</text>
      <text class="card-body" x="14" y="62">• Max image dimension: &lt;= 40 MP</text>
      <text class="card-body" x="14" y="80">• Allowed: JPEG, PNG, WebP</text>
      <text class="card-body" x="14" y="98">• India Geofence BBox validation:</text>
      <text class="card-accent" x="18" y="118">lat: 6.0° - 38.0° N | lng: 68.0° - 98.0° E</text>
      <text class="card-body" x="14" y="136">• Strict SHA-256 deduplication</text>
    </g>

    <!-- Database & Storage Box -->
    <g transform="translate(18, 433)">
      <rect width="234" height="240" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="card-title" x="14" y="24">Persistence &amp; Storage</text>

      <text class="card-accent" x="14" y="48">SQLite 3 (WAL mode) + SQLAlchemy</text>
      <text class="card-body" x="14" y="68"><tspan font-weight="700" fill="#f8fafc">images:</tspan> sha256, w, h, lat, lng, exif</text>
      <text class="card-body" x="14" y="86"><tspan font-weight="700" fill="#f8fafc">detections:</tspan> box, class, conf, severity</text>
      <text class="card-body" x="14" y="104"><tspan font-weight="700" fill="#f8fafc">segments:</tspan> centroid, priority, status</text>
      <text class="card-body" x="14" y="122"><tspan font-weight="700" fill="#f8fafc">jobs:</tspan> video progress, track summary</text>

      <line x1="14" y1="138" x2="220" y2="138" stroke="#334155" stroke-width="1" />

      <text class="card-accent" x="14" y="160">Media Storage Engine</text>
      <text class="card-body" x="14" y="180">• Annotated images (max 1280px edge)</text>
      <text class="card-body" x="14" y="198">• Fast thumbnails (max 320px edge)</text>
      <text class="card-body" x="14" y="216">• Atomic disk flush &amp; hash lookup</text>
    </g>
  </g>

  <!-- ================= 3. AI INFERENCE & TRACKING LAYER ================= -->
  <g transform="translate(640, 115)">
    <rect width="280" height="340" rx="12" fill="#131b2e" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="20" y="20" width="8" height="8" rx="4" fill="#a855f7" />
    <text class="layer-title" x="36" y="28">3. AI Inference &amp; Tracking</text>

    <!-- YOLO11s Box -->
    <g transform="translate(18, 48)">
      <rect width="244" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="card-title" x="14" y="24">Ultralytics YOLO11s Detector</text>
      <text class="card-body" x="14" y="44">Backbone: C3k2 + SPPF + C2PSA Attention</text>
      <text class="card-body" x="14" y="60">Input: 640×640 px | Params: 9.4M</text>
      <text class="card-accent" x="14" y="80">Trained on RDD2022 India Subset</text>
      <text class="card-body" x="14" y="98">Latency: 1.28ms (A100 GPU) / 151ms (CPU)</text>
      <text class="card-math" x="14" y="118">Optimal Conf Gate = 0.193 (Max F1)</text>
      <text class="card-body" x="14" y="136">ONNX Runtime dual-target execution</text>
    </g>

    <!-- ByteTrack Box -->
    <g transform="translate(18, 210)">
      <rect width="244" height="110" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="card-title" x="14" y="24">ByteTrack Video Deduplication</text>
      <text class="card-body" x="14" y="44">Kalman Filter motion estimation</text>
      <text class="card-body" x="14" y="60">Two-stage bipartite IoU matching</text>
      <text class="card-accent" x="14" y="82">Assigns persistent unique Track IDs</text>
      <text class="card-body" x="14" y="98">Prevents duplicate defect counts in videos</text>
    </g>
  </g>

  <!-- ================= 4. SEVERITY & CIVIL ENGINEERING RULES ================= -->
  <g transform="translate(640, 470)">
    <rect width="280" height="340" rx="12" fill="#131b2e" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="20" y="20" width="8" height="8" rx="4" fill="#f59e0b" />
    <text class="layer-title" x="36" y="28">4. Class-Aware Severity Engine</text>

    <!-- Severity Math Box -->
    <g transform="translate(18, 48)">
      <rect width="244" height="272" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="card-title" x="14" y="24">2D Geometric Extent Proxy</text>
      
      <text class="card-accent" x="14" y="48">D40 (Pothole) &amp; D20 (Alligator):</text>
      <text class="card-math" x="20" y="66">e_area = (w_box · h_box) / (W_img · H_img)</text>
      <text class="card-body" x="20" y="82">D40 Bounds: e_low=0.015, e_high=0.05</text>
      <text class="card-body" x="20" y="98">D20 Bounds: e_low=0.030, e_high=0.10</text>

      <text class="card-accent" x="14" y="122">D00 (Longitudinal) &amp; D10 (Transverse):</text>
      <text class="card-math" x="20" y="140">e_diag = sqrt(w_box² + h_box²) / diag_img</text>
      <text class="card-body" x="20" y="156">Crack Bounds: e_low=0.15, e_high=0.35</text>

      <line x1="14" y1="172" x2="230" y2="172" stroke="#334155" stroke-width="1" />

      <text class="card-accent" x="14" y="194">Piece-wise Continuous Score [0-100]</text>
      <text class="card-body" x="20" y="212">Low: [0, 33.3)  • Medium: [33.3, 66.7)</text>
      <text class="card-body" x="20" y="228">High: [66.7, 100.0]</text>
      <text class="card-math" x="20" y="250">D20 floor constraint: min tier = Medium</text>
    </g>
  </g>

  <!-- ================= 5. GEO-CLUSTERING & PRIORITIZATION ================= -->
  <g transform="translate(950, 115)">
    <rect width="270" height="695" rx="12" fill="#131b2e" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="20" y="20" width="8" height="8" rx="4" fill="#f43f5e" />
    <text class="layer-title" x="36" y="28">5. Spatial Clustering &amp; Priority</text>

    <!-- 25m Haversine DBSCAN Box -->
    <g transform="translate(18, 48)">
      <rect width="234" height="155" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="card-title" x="14" y="24">25m Haversine DBSCAN</text>
      <text class="card-body" x="14" y="44">Spherical distance metric:</text>
      <text class="card-math" x="14" y="64">d = 2R · arcsin(sqrt(hav(Δlat)+...))</text>
      <text class="card-body" x="14" y="84">Radius: eps = 25.0 meters</text>
      <text class="card-body" x="14" y="100">Density threshold: min_samples = 1</text>
      <text class="card-accent" x="14" y="122">Groups proximate road hazards</text>
      <text class="card-body" x="14" y="138">Calculates geographic centroid</text>
    </g>

    <!-- OSM Road Class Resolver -->
    <g transform="translate(18, 218)">
      <rect width="234" height="135" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="card-title" x="14" y="24">OSM Road Hierarchy (R)</text>
      <text class="card-body" x="14" y="44">Overpass API (radius: 30m, 5s timeout)</text>
      <text class="card-body" x="14" y="62">Weights by traffic throughput:</text>
      <text class="card-accent" x="14" y="82">Motorway / Trunk: 100</text>
      <text class="card-body" x="14" y="98">Primary: 85 | Secondary: 70</text>
      <text class="card-body" x="14" y="114">Tertiary: 55 | Residential: 35</text>
    </g>

    <!-- 4-Term Priority Ledger Box -->
    <g transform="translate(18, 368)">
      <rect width="234" height="305" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="card-title" x="14" y="24">Maintenance Priority Math</text>
      
      <text class="card-accent" x="14" y="50">Explainable 4-Term Formula:</text>
      <text class="card-math" x="14" y="74">P = 0.45·S_max + 0.25·D</text>
      <text class="card-math" x="38" y="94">+ 0.20·R + 0.10·C</text>

      <line x1="14" y1="110" x2="220" y2="110" stroke="#334155" stroke-width="1" />

      <text class="card-body" x="14" y="130"><tspan fill="#f59e0b" font-weight="700">S_max (45%):</tspan> Max severity in cluster</text>
      <text class="card-body" x="14" y="152"><tspan fill="#38bdf8" font-weight="700">D (25%):</tspan> Defect density score</text>
      <text class="card-math" x="24" y="170">D = 100 · min(N / 10, 1.0)</text>
      <text class="card-body" x="14" y="192"><tspan fill="#10b981" font-weight="700">R (20%):</tspan> OSM road importance</text>
      <text class="card-body" x="14" y="214"><tspan fill="#a855f7" font-weight="700">C (10%):</tspan> Mean detector confidence</text>
      <text class="card-math" x="24" y="232">C = 100 · (1/N · Σ conf)</text>

      <line x1="14" y1="248" x2="220" y2="248" stroke="#334155" stroke-width="1" />

      <text class="card-accent" x="14" y="268">Triage Decision Bands:</text>
      <text class="card-body" x="14" y="286">P &gt; 70: High | P 30-70: Med | P &lt; 30: Low</text>
    </g>
  </g>

  <!-- ================= CONNECTING ARROWS ================= -->
  <!-- Client to API Gateway -->
  <path d="M 310 180 L 338 180" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 310 260 L 338 260" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 310 410 L 338 410" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 310 580 L 338 580" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- API Gateway to YOLO11s -->
  <path d="M 610 200 L 638 200" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- YOLO11s to Severity Engine -->
  <path d="M 780 455 L 780 468" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowGold)" />

  <!-- Severity & Coordinates to DBSCAN & Priority Engine -->
  <path d="M 920 280 L 948 280" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 920 580 L 948 580" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Storage bidirectional to API -->
  <path d="M 610 600 L 590 600" fill="none" stroke="#10b981" stroke-width="2" />

</svg>
